<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingreso de conductores</title>
    <link rel="icon" type="image/png" href="assets/logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha384-iw3OoTErCYJJB9mCa8LNS2hbsQ7M3C0EpIsO/H5+EGAkPGc6rk+V8i04oW/K5xq0" crossorigin="anonymous">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(160deg, #ecfdf5 0%, #f8fafc 60%, #eef2ff 100%);
            display: flex; align-items: center; justify-content: center; padding: 18px;
        }
        .tarjeta {
            width: 100%; max-width: 420px; background: #fff; border-radius: 20px;
            padding: 26px 22px; box-shadow: 0 18px 50px rgba(15,23,42,.14);
        }
        .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
        .logo img { height: 40px; }
        .logo div span { display: block; font-size: .58rem; letter-spacing: .12em; color: #64748b; font-weight: 700; }
        .logo div strong { font-size: .95rem; color: #0f172a; }
        h1 { font-size: 1.25rem; margin: 0 0 4px; color: #0f172a; }
        .sub { font-size: .83rem; color: #64748b; margin: 0 0 20px; }
        label { display: block; font-size: .68rem; font-weight: 700; letter-spacing: .06em; color: #64748b; margin: 14px 0 6px; }
        select, input {
            width: 100%; padding: 12px 14px; border: 1px solid #e2e8f0; border-radius: 12px;
            font-size: .95rem; color: #0f172a; background: #fff; outline: none;
        }
        select:focus, input:focus { border-color: #10b981; box-shadow: 0 0 0 3px rgba(16,185,129,.15); }
        button {
            width: 100%; margin-top: 22px; padding: 14px; border: none; border-radius: 12px;
            background: #10b981; color: #fff; font-size: .95rem; font-weight: 700; cursor: pointer;
        }
        button:disabled { background: #cbd5e1; cursor: not-allowed; }
        .aviso { margin-top: 14px; font-size: .76rem; color: #92400e; background: #fffbeb; border: 1px solid #fcd34d; border-radius: 10px; padding: 10px 12px; line-height: 1.45; display: none; }
        .volver { display: inline-block; margin-top: 18px; font-size: .8rem; color: #64748b; text-decoration: none; }
        .paso { font-size: .7rem; color: #94a3b8; font-weight: 700; letter-spacing: .05em; }

        .dni-input {
            font-size: 1.5rem; letter-spacing: .32em; text-align: center;
            font-weight: 700; padding: 14px 12px;
        }
        .dni-input::placeholder { letter-spacing: .06em; font-size: .9rem; font-weight: 600; color: #94a3b8; }
        .ayuda-dni { margin: 8px 0 0; font-size: .74rem; color: #94a3b8; }
        .error-dni {
            display: none; margin: 10px 0 0; font-size: .78rem; line-height: 1.4;
            color: #b91c1c; background: #fef2f2; border: 1px solid #fecaca;
            border-radius: 10px; padding: 9px 11px;
        }

        .identidad {
            display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
            background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 14px;
            padding: 12px 14px; margin: 4px 0 2px;
        }
        .identidad-dato { display: flex; flex-direction: column; gap: 2px; }
        .identidad-etq { font-size: .6rem; font-weight: 800; letter-spacing: .1em; color: #15803d; }
        .identidad-dato strong { font-size: .92rem; color: #0f172a; line-height: 1.25; }
        .cambiar {
            width: auto; margin: 0 0 0 auto; padding: 8px 11px; font-size: .72rem;
            background: #fff; color: #64748b; border: 1px solid #e2e8f0; border-radius: 10px;
            display: inline-flex; align-items: center; gap: 6px;
        }

        .bloqueo {
            background: #fef2f2; border: 1px solid #fecaca; border-radius: 14px;
            padding: 13px 15px; margin-bottom: 16px;
        }
        .bloqueo-titulo {
            display: flex; align-items: center; gap: 7px;
            font-size: .84rem; font-weight: 800; color: #b91c1c;
        }
        .bloqueo p { margin: 7px 0 11px; font-size: .79rem; color: #7f1d1d; line-height: 1.45; }
        .bloqueo button {
            width: auto; margin: 0; padding: 9px 14px; font-size: .8rem;
            background: #dc2626; border-radius: 10px; display: inline-flex; align-items: center; gap: 6px;
        }
    </style>
</head>
<body>
    <div class="tarjeta">
        <div class="logo">
            <img src="assets/logo.png" alt="Logo">
            <div>
                <span>CENTRO DE OPERACIONES</span>
                <strong>Plan de Contingencia</strong>
            </div>
        </div>

        <h1>Ingreso de conductores</h1>
        <p class="sub">Ingresa tu DNI y elige la unidad para compartir tu ubicación durante el turno.</p>

        <div class="bloqueo" id="bloqueo-ubicacion" style="display:none">
            <div class="bloqueo-titulo"><i class="fas fa-location-crosshairs"></i> Ubicación obligatoria</div>
            <p id="bloqueo-texto"></p>
            <button type="button" id="btn-activar-ubicacion" onclick="abrirAjustesUbicacion()">
                <i class="fas fa-location-arrow"></i> Activar ubicación
            </button>
        </div>

        <div id="gate-dni">
            <span class="paso">PASO 1</span>
            <label for="inp-dni">DNI del conductor</label>
            <input id="inp-dni" class="dni-input" type="tel" inputmode="numeric" pattern="[0-9]*"
                   maxlength="8" placeholder="8 dígitos" name="dni-conductor"
                   autocomplete="off" autocorrect="off" autocapitalize="off"
                   spellcheck="false" enterkeyhint="done">
            <p class="ayuda-dni">Solo números, sin puntos ni espacios.</p>
            <div class="error-dni" id="dni-error"></div>
            <button type="button" id="btn-validar-dni" onclick="identificar()" disabled>
                <i class="fas fa-id-card"></i> Continuar
            </button>
        </div>

        <div id="bloque-conductor" style="display:none">
            <div class="identidad">
                <div class="identidad-dato">
                    <span class="identidad-etq">DNI</span>
                    <strong id="ident-dni">—</strong>
                </div>
                <div class="identidad-dato">
                    <span class="identidad-etq">CONDUCTOR</span>
                    <strong id="ident-nombre">—</strong>
                </div>
                <button type="button" class="cambiar" id="btn-cambiar-dni" onclick="volverADni()">
                    <i class="fas fa-user-pen"></i> No soy yo
                </button>
            </div>

            <div id="pasos-unidad">
                <span class="paso">PASO 2</span>
                <label>Serie de la unidad</label>
                <select id="sel-prefijo">
                    <option value="">Selecciona la serie</option>
                </select>

                <span class="paso">PASO 3</span>
                <label>Unidad</label>
                <select id="sel-unidad" disabled>
                    <option value="">Primero elige la serie</option>
                </select>
            </div>

            <button id="btn-entrar" onclick="iniciarTurno()" disabled>
                <i class="fas fa-play"></i> Iniciar turno
            </button>
        </div>

        <div class="aviso" id="aviso"></div>

        <a class="volver" href="index.html"><i class="fas fa-arrow-left"></i> Retroceder</a>
        <a class="volver" href="licencias.html" style="margin-left:14px"><i class="fas fa-scale-balanced"></i> Licencias</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js" integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK" crossorigin="anonymous"></script>
    <script src="conductor.js?v=21"></script>
    <script src="evac_auto.js?v=3"></script>
</body>
</html>
