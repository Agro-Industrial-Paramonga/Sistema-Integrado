name: Publicar APK

on:
  workflow_dispatch:
    inputs:
      notas:
        description: 'Qué cambió en esta versión'
        required: false
        default: 'Mejoras y correcciones'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar web en la app
        run: |
          mkdir -p app/www
          cp -r plan-contingencia app/www/ || true
          cp -r hallazgos app/www/ || true
          cp index.html app/www/ || true

      - name: Compilar APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Renombrar APK
        run: |
          mkdir -p salida
          cp app/android/app/build/outputs/apk/debug/app-debug.apk salida/app-debug.apk

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Versión ${{ github.run_number }}
          body: ${{ github.event.inputs.notas }}
          files: salida/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
